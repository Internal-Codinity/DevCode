services:
  postgres:
    image: postgres:16.8-alpine@sha256:55d6cd2670f3a2b999a486fc75a8af723375576016bcdff8334d12ac6f69494f
    restart: unless-stopped
    environment:
      POSTGRES_DB: codium
      POSTGRES_USER: codium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codium -d codium"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  migrate:
    image: ${CODIUM_WORKER_IMAGE:?build the worker target and set CODIUM_WORKER_IMAGE}
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/migrate.ts"]
    environment: &platform-env
      NODE_ENV: production
      DATABASE_URL: postgresql://codium:${POSTGRES_PASSWORD}@postgres:5432/codium
      DATABASE_POOL_MAX: 10
      APP_URL: ${APP_URL:?set APP_URL to your public HTTPS URL}
      SMTP_HOST: ${SMTP_HOST:?configure SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:?configure SMTP_FROM}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RUNNER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    restart: "no"

  web:
    image: ${CODIUM_IMAGE:?build and set CODIUM_IMAGE}
    restart: unless-stopped
    environment: *platform-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  judge:
    image: ${CODIUM_WORKER_IMAGE:?build worker target and set CODIUM_WORKER_IMAGE}
    restart: unless-stopped
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/judge-worker.ts"]
    environment:
      <<: *platform-env
      RUNNER_WORKER: "true"
      RUNNER_DOCKER_HOST: unix:///var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [private]
    user: "10001:10001"
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the numeric group that owns /var/run/docker.sock}"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The judge is intentionally not attached to a public network and is the
    # sole platform container allowed to access the Docker socket.

volumes:
  postgres-data:

networks:
  private:
    internal: true
